<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página</title>
    <link rel="stylesheet" href="./assets/CSS/styles.css">
</head>
<body>
    <nav class="nav">
    <div class="container-nav">
        <div class="logo">
            <img src="./assets/img/pec.png" alt="logo pec" class="logo-img">
        </div>
        <ul class="menu-navigation">
            <li><a href="#ini">Inicio</a></li>
            <li><a href="#recipe">Recetas</a></li>
            <li><a href="#equi">Equivalencias</a></li>
            <li><a href="#contact">Contáctanos</a></li>
        </ul>
    </div>
    </nav>
    <section id="hero" class="hero">
        <div>
        <h1 class="hero-titulo">
            <span class="titulo">Pastelería en casa</span>
            <span class="subtitulo">Recetas paso a paso para hacer en tu hogar</span>
        </h1>
        </div>
            </section>
            <section class="container">
        <div class="card-postre">
        <div class="card-torta">
            <img src="./assets/img/20230628-LemonPie.jpg" alt="Lemon pie" class="img-card">
        </div>
        <div>
            <h3 class="titulo-card">Lemon pie</h3>
        </div>
        </div>
            <div class="card-postre">
        <div class="card-torta">
            <img src="./assets/img/3WBFJRNN75AIHLT6QHU5VLNUIY.jpg" alt="Torta del diablo" class="img-card">
        </div>
        <div>
            <h3 class="titulo-card">Torta del diablo</h3>
        </div>
        </div>
        <div class="card-postre">
        <div class="card-torta">
            <img src="./assets/img/blog_5.webp" alt="Cheesecake" class="img-card">
        </div>
        <div>
            <h3 class="titulo-card">Cheesecake</h3>
        </div>
        </div>
        <div class="card-postre">
        <div class="card-torta">
            <img src="./assets/img/red-velvet-sodas-el-vesubio-tarta.jpg" alt="Red velvet" class="img-card">
        </div>
        <div>
            <h3 class="titulo-card">Red velvet</h3>
        </div>
        </div>
        </section>
        <section class="contact-section">
            <div class="contact-container">
            <h3 class="titulo-contacto">¿Tienes alguna duda sobre las recetas?</h3>
            <p class="subtitulo-cont">Contáctanos aqui abajo 👇</p>
            <form class="contact" action="#" method="POST">
                <div class="info-contact">
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre" placeholder="Nombre" required>
                </div>
                <div class="info-contact">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="tu@email.com" required>
                </div>
                <div class="info-contact">
                    <label for="message">Mensaje</label>
                    <textarea name="message" id="message" placeholder="Escribe aqui tu mensaje..." rows="4" required></textarea>
                </div>
                <div class="boton-contacto">
                <button type="submit" class="boton-enviar">
                    <span>Enviar</span>
                </button>
                </div>
            </form>
            </div>
        </section>
    <main>
        <div class="info">
    <h1 class="nombre">Eliana González</h1>
    <p id="texto-magico" class="magico">Presiona el botón para ver la magia</p>
    <button id="mi-boton" class="boton">Cambiar</button>
    </div>
    </main>
    <script src="./js/script.js"></script>
</body>
</html>
